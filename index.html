    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Ремонт-Тренер</title>
    <script>
      // тема до загрузки приложения, чтобы при тёмной теме не мигал светлый фон
      try {
        var t = (JSON.parse(localStorage.getItem('remont-trainer:v1') || '{}').theme) || 'system';
        var d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        document.documentElement.style.background = d ? '#000' : '#f5f5f7';
      } catch (e) {}
    </script>
